[project]
name = "saleslens-backend"
version = "0.1.0"
description = "SalesLens FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "fastapi>=0.115.0",
  "faster-whisper>=1.0.3",
  "httpx>=0.27.0",
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "numpy>=2.1.0",
  "openai>=1.50.0",
  "pgvector>=0.3.4",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.6.0",
  "pyannote.audio>=3.3.2",
  "python-multipart>=0.0.9",
  "redis>=5.1.1",
  "sqlalchemy>=2.0.36",
  "textblob>=0.18.0.post0",
  "torch>=2.8.0",
  "torchvision>=0.23.0",
  "uvicorn[standard]>=0.32.0",
  "faiss-cpu>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true